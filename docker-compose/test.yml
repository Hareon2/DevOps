version: '3'
services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - frontend
    restart: always
    container_name: app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - frontend
    depends_on:
      - app

networks:
  frontend:
    driver: bridge
